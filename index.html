<style>:root{--wine:#1f3f7a;--wine2:#13264d;--gold:#c9962b;--gold2:#e8c66a;--cream:#fbf3e2;--pearl:#fffbf1;--ink:#2a1318;--mut:#725a5f;--blue:#1d3f6e;--green:#2f6b3a;--red:#b3262e}

html,body{margin:0;background:var(--cream);color:var(--ink);font:17px/1.45 "Noto Sans Georgian","Noto Sans","Segoe UI",system-ui,sans-serif}
body{background-image:radial-gradient(circle at 20% 10%,rgba(201,150,43,.10),transparent 40%),radial-gradient(circle at 90% 80%,rgba(31,63,122,.07),transparent 45%);min-height:100vh}
#app{max-width:640px;margin:0 auto;padding-bottom:96px}
.hdr{position:relative;background:linear-gradient(180deg,var(--wine),var(--wine2));color:#fff3d6;text-align:center;padding:22px 56px 16px;border-bottom:4px solid var(--gold);box-shadow:0 3px 10px rgba(0,0,0,.25)}
.hdr h1{margin:0;font:700 25px Georgia,serif;letter-spacing:.3px}.hdr .ka{font-size:17px;color:var(--gold2);margin-top:2px}
.back{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:2px solid var(--gold);background:rgba(0,0,0,.25);color:#fff3d6;font-size:24px}
.wrap{padding:14px 14px 0}
.h2{font:700 21px Georgia,serif;color:var(--wine);margin:18px 0 8px}
.note{background:#fff4d8;border-radius:12px;padding:9px 12px;font-size:14px;color:var(--mut);box-shadow:inset 0 0 0 1px var(--gold2);margin:8px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;background:var(--pearl);border:0;border-radius:22px;padding:16px 8px 14px;font:inherit;color:inherit;cursor:pointer;box-shadow:0 4px 0 var(--gold2),0 6px 12px rgba(70,30,20,.16),inset 0 0 0 1.5px var(--gold2)}
.tile:active{transform:translateY(2px)}
.md{width:88px;height:88px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px var(--gold),0 0 0 6px #fff7dd,0 4px 10px rgba(60,30,10,.3);overflow:hidden;margin:4px 0 8px}
.md b{font-size:40px;color:#fff7e0;text-shadow:0 2px 3px rgba(0,0,0,.35);font-weight:400}.md img{width:100%;height:100%;object-fit:cover}
.tt{font:700 16px Georgia,serif;line-height:1.2}.sb{font-size:12.5px;color:var(--mut);padding:0 4px}
.bg{position:absolute;top:8px;right:10px;background:var(--green);color:#fff;border-radius:12px;font-size:12px;padding:2px 8px;font-weight:700}
.item{display:flex;align-items:center;gap:12px;width:100%;background:var(--pearl);border:0;border-radius:16px;padding:12px 14px;margin:8px 0;text-align:left;font:inherit;color:inherit;cursor:pointer;box-shadow:0 2px 6px rgba(70,40,20,.14),inset 0 0 0 1.5px var(--gold2)}
.item .big{font-size:30px;min-width:58px;text-align:center;color:var(--wine)}.item .t{font-weight:700}.mut{color:var(--mut);font-size:14px}
.badge{margin-left:auto;background:var(--green);color:#fff;border-radius:12px;font-size:12px;padding:2px 8px;font-weight:700}
.letters{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.lt{position:relative;background:var(--pearl);border:0;border-radius:16px;padding:10px 4px 8px;text-align:center;font:inherit;cursor:pointer;box-shadow:0 3px 0 var(--gold2),inset 0 0 0 1.5px var(--gold2)}
.lt .g{font-size:38px;color:var(--wine);line-height:1.1}.lt .r{font-size:14px;color:var(--mut)}
.lt.on{background:#eaf5e6;box-shadow:0 3px 0 #8ccf84,inset 0 0 0 1.5px #5aa65a}.lt.on::after{content:"✓";position:absolute;top:2px;right:7px;color:var(--green);font-weight:700}
.lt.ej .r{color:var(--red);font-weight:700}
.card{background:var(--pearl);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 8px rgba(70,40,20,.14),inset 0 0 0 1.5px var(--gold2);text-align:center}
.huge{font-size:96px;line-height:1.1;color:var(--wine)}.q{font-size:64px;line-height:1.15;color:var(--wine)}.q.sm{font-size:40px}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:14px;margin:10px 0;font:700 17px inherit;font-family:inherit;color:#fff;background:var(--wine);box-shadow:0 4px 0 var(--wine2);cursor:pointer}
.btn.alt{background:var(--blue);box-shadow:0 4px 0 #11284a}.btn.ghost{background:var(--pearl);color:var(--wine);box-shadow:0 3px 0 var(--gold2),inset 0 0 0 1.5px var(--gold2)}
.opt{display:block;width:100%;border:0;border-radius:16px;padding:14px;margin:9px 0;font:inherit;font-size:20px;background:var(--pearl);color:var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--gold2),inset 0 0 0 1.5px var(--gold2)}
.opt.ok{background:#dff1da;box-shadow:0 3px 0 #7fc27a,inset 0 0 0 2px #3f9d46}.opt.bad{background:#f9dcdc;box-shadow:0 3px 0 #e19090,inset 0 0 0 2px var(--red)}
.opt .ka2{font-size:30px}.opt i{display:block;font-size:14px;color:var(--mut);font-style:normal}
.bar{height:10px;background:#ead9b3;border-radius:6px;overflow:hidden;margin:6px 0 4px}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--wine))}
.search{width:100%;padding:13px 14px;font:inherit;border-radius:14px;border:2px solid var(--gold2);background:var(--pearl)}
.wrow{display:flex;align-items:center;gap:10px;background:var(--pearl);border-radius:14px;padding:10px 12px;margin:7px 0;box-shadow:inset 0 0 0 1.5px var(--gold2)}
.wrow .g{font-size:26px;color:var(--wine);min-width:96px}.wrow .x{flex:1;line-height:1.25}.wrow .x i{color:var(--mut);font-style:normal;font-size:14px}
.say{border:0;background:var(--gold);color:#fff;border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;flex:none}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:linear-gradient(180deg,#fff3d6,#f0d99b);border-top:3px solid var(--gold);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:10}
.nav button{flex:1;border:0;background:none;font:inherit;font-size:13px;font-weight:700;color:var(--wine2);padding:4px 2px;border-radius:12px;cursor:pointer;max-width:120px}
.nav button b{display:block;font-size:24px;line-height:1.1;font-weight:400}.nav button.on{background:rgba(31,63,122,.14);box-shadow:inset 0 0 0 2px var(--gold)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cmp>div{background:var(--pearl);border-radius:14px;padding:10px;text-align:center;box-shadow:inset 0 0 0 1.5px var(--gold2)}.cmp .g{font-size:44px;color:var(--wine)}

.hero{position:relative;margin:10px 10px 0;border-radius:22px;overflow:hidden;box-shadow:0 0 0 3px var(--gold),0 6px 14px rgba(60,30,10,.3);background:#d9c08a}
.hero img{display:block;width:100%;aspect-ratio:780/230;object-fit:cover}

.hi{position:absolute;left:34%;top:8px;font:700 17px Georgia,serif;color:#fff;text-shadow:0 1px 3px #000}
.ht{position:absolute;right:12px;top:50%;transform:translateY(-50%);text-align:center;width:48%}

.pt{border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:center}.pt:active{transform:translateY(2px)}

.pi img{width:100%;height:100%;object-fit:cover;display:block}
.pl{position:absolute;left:4px;right:4px;bottom:5px;background:linear-gradient(180deg,#7a1f2b,#4d1019);color:#fff3d6;border-radius:12px;padding:3px 2px;font:700 clamp(11px,3.4vw,15px)/1.15 Georgia,serif;box-shadow:0 0 0 1.5px var(--gold)}
.pk{display:block;font-size:13px;color:var(--wine);margin-top:5px}
.town{position:relative;display:block;width:100%;border:0;padding:0;margin:14px 0 0;border-radius:20px;overflow:hidden;box-shadow:0 0 0 3px var(--gold),0 5px 12px rgba(60,30,10,.3);cursor:pointer;background:none}

.pt{display:flex;flex-direction:column;align-items:stretch}
.pi{aspect-ratio:auto;border-radius:18px 18px 0 0;box-shadow:none}.pi img{aspect-ratio:210/172;height:auto}

 LET.map(function(l,i){return '<button class="lt'+(S.learned[l[0]]?' on':'')+(l[7]==="vow"?' ej':'')+(l[7]==="sign"?' sg':'')+'" data-go="let" data-i="'+i+'"><div class="g">'+l[0]+'</div><div class="r">'+esc(l[1])+'</div></button>';}).join("")+'</div></div>';};
VIEWS.let=function(){var i=+V.p.i,l=LET[i],on=!!S.learned[l[0]],nx=(i+1)%LET.length,pv=(i+LET.length-1)%LET.length;
 var nt={vow:"Vokal. Vokale sind „hart“ (а э ы о у) oder „weich“ (я е и ё ю).",sign:"Zeichen ohne eigenen Laut. Es verändert nur den Konsonanten davor."}[l[7]]||"";
 return hdr(l[0]+" · "+esc(l[1]),esc(l[2]),1)+'<div class="wrap"><div class="card"><div class="huge">'+l[0]+'</div><div style="font-size:24px"><b>'+esc(l[1])+'</b> · '+esc(l[2])+'</div>'+(l[7]!=="sign"?'<button class="say" data-say="'+esc(l[4])+'" style="margin-top:10px" aria-label="Anhören">♫</button>':'')+'</div>'+
 '<div class="card" style="text-align:left"><b>Aussprache:</b> '+esc(l[3])+(nt?'<br><span class="mut">'+nt+'</span>':'')+'</div>'+
 '<div class="card" style="text-align:left"><b>Beispiel:</b><div class="wrow" style="box-shadow:none;padding:6px 0"><span class="g">'+l[4]+'</span><span class="x">'+esc(l[5])+'<br><i>'+esc(l[6])+'</i></span><button class="say" data-say="'+esc(l[4])+'" aria-label="Anhören">♫</button></div></div>'+
 '<button class="btn'+(on?' ghost':'')+'" data-a="learn" data-i="'+i+'">'+(on?'✓ Gelernt (zurücknehmen)':'Als gelernt abhaken')+'</button>'+
 '<div style="display:flex;gap:10px"><button class="btn ghost" data-go="let" data-i="'+pv+'" data-rep="1">‹ '+LET[pv][0]+'</button><button class="btn ghost" data-go="let" data-i="'+nx+'" data-rep="1">'+LET[nx][0]+' ›</button></div></div>';};
VIEWS.freunde=function(){return hdr("Falsche Freunde","Ложные друзья",1)+'<div class="wrap"><div class="note">Diese kyrillischen Buchstaben sehen aus wie lateinische, werden aber anders gesprochen. Das ist die häufigste Falle beim Lesenlernen.</div>'+
 FF.map(function(f){return '<div class="cmp" style="margin:10px 0"><div><div class="g">'+f[0]+'</div><span class="mut">sieht aus wie</span><br><b>'+esc(f[1])+'</b></div><div><div class="g" style="font-size:34px">'+esc(f[2])+'</div><span class="mut">klingt wie</span><div>'+f[3]+' · '+esc(f[4])+'</div><div class="mut">'+esc(f[5])+'</div><button class="say" data-say="'+f[3]+'">♫</button></div></div>';}).join("")+'</div>';};
VIEWS.beton=function(){return hdr("Betonung und Weichheit","Ударение и мягкость",1)+'<div class="wrap">'+
 '<div class="card" style="text-align:left"><b>1. Betonung</b><br>Im Russischen ist die betonte Silbe lang und deutlich, die anderen sind schwach. Die Betonung wird nicht geschrieben und springt von Wort zu Wort. In der Umschrift steht der <b>betonte Vokal GROSS</b>: мама = mAma, вода = wadA.</div>'+
 '<div class="card" style="text-align:left"><b>2. Unbetontes о klingt wie а</b><br>окно = aknO, молоко = malakO. Man schreibt о, spricht aber a.</div>'+
 '<div class="card" style="text-align:left"><b>3. Hart und weich</b><br>Harte Vokale: <span class="ka2">а э ы о у</span><br>Weiche Vokale: <span class="ka2">я е и ё ю</span><br>Nach ihnen wird der Konsonant weicher: ма (ma) – мя (mja), ты (ty) – ти (ti).</div>'+
 '<div class="card" style="text-align:left"><b>4. Das Weichheitszeichen ь</b><br>Es macht den Konsonanten davor weich: день (Tag), соль (Salz). Es hat keinen eigenen Laut.</div>'+
 '<div class="card" style="text-align:left"><b>5. Immer hart, immer weich</b><br>ж, ш, ц sind immer hart. ч, щ sind immer weich.</div>'+
 '<div class="card" style="text-align:left"><b>6. Stimmlos am Wortende</b><br>Am Wortende werden stimmhafte Laute stimmlos: друг klingt wie „druk“, хлеб wie „chlep“.</div></div>';};
VIEWS.entd=function(){var F=[["🏔️","Größe","Russland ist das größte Land der Erde und reicht über elf Zeitzonen."],["🏛️","Hauptstadt","Moskau, Москва. Am Roten Platz steht die bunte Basilius-Kathedrale."],["🔤","Schrift","Das Alphabet heißt Kyrillisch. Es hat im Russischen 33 Buchstaben und wird auch in anderen Sprachen benutzt."],["🏞️","Baikalsee","Der Baikal in Sibirien ist der tiefste See der Erde."],["🚆","Transsib","Die Transsibirische Eisenbahn fährt von Moskau bis Wladiwostok, rund 9 300 Kilometer."],["🫖","Tee","Zum Tee gehört der Samowar. Dazu gibt es süße Kringel, die Bubliki."],["🥣","Essen","Борщ (Borschtsch) ist Rote-Bete-Suppe. Пельмени (Pelmeni) sind Teigtaschen."],["🪆","Matrjoschka","Die bemalten Holzpuppen, die ineinander passen, sind ein bekanntes Symbol."],["🎄","Neujahr","Das Neujahrsfest ist das wichtigste Fest. Дед Мороз (Ded Moros) bringt die Geschenke."]];
 return hdr("Russland entdecken","Открыть Россию",1)+'<div class="wrap"><div class="town st"><img alt="" src="data:image/webp;base64,'+LI.town+'"></div>'+F.map(function(f){return '<div class="card"><b>'+f[0]+' '+f[1]+'</b><div>'+f[2]+'</div></div>';}).join("")+'</div>';};
NAVMAP.entd="home";NAVMAP.freunde="lernen";NAVMAP.beton="lernen";

var Q=null;
function opts(c,pool,key,n){var o=[c];shuf(pool.filter(function(x){return x[key]!==c[key];})).slice(0,(n||4)-1).forEach(function(x){o.push(x);});return shuf(o);}
function allWords(){var a=[];CATS.forEach(function(c){c.w.forEach(function(w){if(w[0].indexOf(" ")<0&&w[0].indexOf("?")<0)a.push(w);});});return a;}
var LQ=LET.filter(function(l){return l[7]!=="sign";}),FQ=LQ.filter(function(l){return l[0]!=="Ыы";});
function buildQ(id){var qs=[],i;
 if(id==="l2s")shuf(LQ).slice(0,10).forEach(function(l){qs.push({q:'<div class="q">'+l[0]+'</div>',h:"Welcher Laut ist das?",o:opts(l,LQ,1).map(function(x){return{t:esc(x[1]),ok:x===l};}),ex:l[0]+" = "+l[1],say:l[4]});});
 if(id==="s2l")shuf(LQ).slice(0,10).forEach(function(l){qs.push({q:'<div class="q sm" style="font-family:Georgia">'+esc(l[1])+'</div><div class="mut">'+esc(l[3])+'</div>',h:"Welcher Buchstabe passt?",o:opts(l,LQ,0).map(function(x){return{t:'<span class="ka2">'+x[0]+'</span>',ok:x===l};}),ex:l[1]+" = "+l[0]});});
 if(id==="first")shuf(FQ).slice(0,10).forEach(function(l){qs.push({q:'<div class="q sm">'+l[4]+'</div><div class="mut">'+esc(l[5])+'</div>',h:"Mit welchem Buchstaben beginnt das Wort?",o:opts(l,FQ,0).map(function(x){return{t:'<span class="ka2">'+x[0]+'</span>',ok:x===l};}),ex:l[4]+" ("+l[5]+") beginnt mit "+l[0],say:l[4]});});
 if(id==="read"){var W=allWords();shuf(W).slice(0,10).forEach(function(w){qs.push({q:'<div class="q sm">'+w[0]+'</div>',h:"Wie liest man das Wort?",o:opts(w,W,1).map(function(x){return{t:esc(x[1]),ok:x===w};}),ex:w[0]+" = "+w[1]+" ("+w[2]+")",say:w[0]});});}
 if(id==="wde"){var W2=allWords();shuf(W2).slice(0,10).forEach(function(w){qs.push({q:'<div class="q sm">'+w[0]+'</div><div class="mut">'+esc(w[1])+'</div>',h:"Was bedeutet das?",o:opts(w,W2,2).map(function(x){return{t:esc(x[2]),ok:x===w};}),ex:w[0]+" ("+w[1]+") = "+w[2],say:w[0]});});}
 if(id==="num")shuf(NUM).forEach(function(n){qs.push({q:'<div class="q sm">'+n[0]+'</div><div class="mut">'+esc(n[1])+'</div>',h:"Welche Zahl ist das?",o:opts(n,NUM,2).map(function(x){return{t:'<span class="ka2">'+x[2]+'</span>',ok:x===n};}),ex:n[0]+" ("+n[1]+") = "+n[2],say:n[0]});});
 return qs;}
var QT={l2s:"Buchstabe → Laut",s2l:"Laut → Buchstabe",first:"Anfangsbuchstabe",read:"Wort lesen",wde:"Wort → Deutsch",num:"Zahlen"};
VIEWS.q=function(){var id=V.p.id;if(!Q||Q.id!==id||V.p.new){Q={id:id,i:0,score:0,res:null,qs:buildQ(id)};V.p.new=0;}
 if(Q.i>=Q.qs.length){S.best[id]=Math.max(S.best[id]||0,Q.score);save();return hdr(QT[id],"Ergebnis",1)+'<div class="wrap"><div class="card"><div class="h2" style="margin-top:0">Geschafft!</div><div class="huge" style="font-size:56px">'+Q.score+' / '+Q.qs.length+'</div><div class="mut">Übung macht den Meister.</div></div><button class="btn" data-a="again" data-id="'+id+'">Nochmal</button><button class="btn ghost" data-a="back">Zurück</button></div>';}
 var q=Q.qs[Q.i];return hdr(QT[id],(Q.i+1)+" von "+Q.qs.length,1)+'<div class="wrap"><div class="bar"><i style="width:'+Math.round(Q.i/Q.qs.length*100)+'%"></i></div><div class="card">'+q.q+(q.say?'<div><button class="say" data-say="'+esc(q.say)+'">♫</button></div>':'')+'<div class="mut" style="margin-top:6px">'+q.h+'</div></div>'+
 q.o.map(function(o,k){var c=Q.res!=null?(o.ok?' ok':(k===Q.res?' bad':'')):'';return '<button class="opt'+c+'" data-ans="'+k+'">'+o.t+'</button>';}).join("")+
 (Q.res!=null?'<div class="note">'+esc(q.ex)+'</div><button class="btn" data-a="next">Weiter</button>':'')+'</div>';};
VIEWS.spiele=function(){var b=function(id){return S.best[id]!=null?S.best[id]:"";};return hdr("Spiele und Übungen","Игры",0)+'<div class="wrap"><div class="h2">Alphabet</div><div class="grid">'+
 tile("q","u_bl","А","Buchstabe → Laut","Welcher Laut gehört dazu?",b("l2s"),"l2s",0)+tile("q","u_lb","Б","Laut → Buchstabe","Welcher Buchstabe passt?",b("s2l"),"s2l",1)+tile("q","u_an","В","Anfangsbuchstabe","Wie beginnt das Wort?",b("first"),"first",2)+tile("q","u_rd","Чт","Wort lesen","Wie liest man das Wort?",b("read"),"read",3)+
 '</div><div class="h2">Wörter und Zahlen</div><div class="grid">'+tile("q","u_wd","вода","Wort → Deutsch","Was bedeutet das Wort?",b("wde"),"wde",4)+tile("q","u_nm","5","Zahlen","Zahlwörter erkennen",b("num"),"num",5)+'</div></div>';};
/* Wörterbuch */
function wRow(w){return '<div class="wrow"><span class="g">'+w[0]+'</span><span class="x"><b>'+esc(w[1])+'</b><br><i>'+esc(w[2])+'</i></span><button class="say" data-say="'+esc(w[0])+'" aria-label="Anhören">♫</button></div>';}
function wbList(q){q=q.trim().toLowerCase();var a=[];CATS.forEach(function(c){c.w.forEach(function(w){if(w[0].toLowerCase().indexOf(q)>=0||w[1].toLowerCase().indexOf(q)>=0||w[2].toLowerCase().indexOf(q)>=0)a.push(w);});});return a;}
VIEWS.wb=function(){return hdr("Wörterbuch","Словарь",1)+'<div class="wrap"><input class="search" id="wbq" type="search" placeholder="Deutsch, Umschrift oder Russisch suchen" autocomplete="off"><div id="wbr">'+wbHome()+'</div></div>';};
function wbHome(){return '<div class="h2">Wörter nach Themen</div><div class="grid">'+tile("num_","c_num","5","Zahlen","Eins bis zehn","","",3)+CATS.map(function(c,i){return tile("wcat","c_"+c.id,c.c,esc(c.t),c.w.length+" Wörter","",c.id,i);}).join("")+'</div>';}
VIEWS.wcat=function(){var c=CATS.filter(function(x){return x.id===V.p.id;})[0];return hdr(esc(c.t),c.c,1)+'<div class="wrap">'+c.w.map(wRow).join("")+'</div>';};
VIEWS.num_=function(){return hdr("Zahlen","Числа",1)+'<div class="wrap">'+NUM.map(function(n){return '<div class="wrow"><span class="g">'+n[2]+'</span><span class="x"><span style="font-size:24px;color:var(--wine)">'+n[0]+'</span><br><b>'+esc(n[1])+'</b></span><button class="say" data-say="'+n[0]+'">♫</button></div>';}).join("")+'</div>';};
VIEWS.studio=function(){var n=nLearned();return hdr("Mein Lernstudio","Мой прогресс",0)+'<div class="wrap"><div class="card"><div class="h2" style="margin-top:0">Dein Fortschritt</div><div class="bar"><i style="width:'+Math.round(n/33*100)+'%"></i></div><div>'+n+' von 33 Buchstaben gelernt</div></div><div class="h2">Beste Ergebnisse</div>'+
 Object.keys(QT).map(function(k){return '<div class="wrow"><span class="x"><b>'+QT[k]+'</b></span><span class="mut">'+(S.best[k]!=null?S.best[k]+" richtig":"noch offen")+'</span></div>';}).join("")+
 '<div class="note">Aussprache und Wörter sind vereinfacht und noch nicht von Muttersprachlern geprüft.</div><button class="btn ghost" data-a="reset">Fortschritt zurücksetzen</button><div class="mut" style="text-align:center;margin-top:10px">'+APP_NAME+' · Version '+VERSION+'</div></div>';};
/* Render + Ereignisse */
function render(){var app=document.getElementById("app");var f=VIEWS[V.n]||VIEWS.home;app.innerHTML=f()+'<div class="nav">'+NAV.map(function(n){return '<button data-nav="'+n[0]+'"'+(NAVMAP[V.n]===n[0]?' class="on"':'')+'><b>'+n[1]+'</b>'+n[2]+'</button>';}).join("")+'</div>';}
document.addEventListener("click",function(e){var t=e.target.closest("[data-say],[data-nav],[data-go],[data-a],[data-ans]");if(!t)return;
 if(t.hasAttribute("data-say")){say(t.getAttribute("data-say"));return;}
 if(t.hasAttribute("data-nav")){ST=[];V={n:t.getAttribute("data-nav"),p:{}};render();window.scrollTo(0,0);return;}
 if(t.hasAttribute("data-ans")){if(Q&&Q.res==null){var k=+t.getAttribute("data-ans"),q=Q.qs[Q.i];Q.res=k;if(q.o[k].ok)Q.score++;render();}return;}
 if(t.hasAttribute("data-go")){var g=t.getAttribute("data-go"),p={};["id","i"].forEach(function(a){if(t.hasAttribute("data-"+a))p[a]=t.getAttribute("data-"+a);});if(g==="q")p.new=1;go(g,p,t.hasAttribute("data-rep"));return;}
 var a=t.getAttribute("data-a");
 if(a==="back"){var b=ST.pop();if(b){V=b;render();window.scrollTo(0,0);}else{V={n:"home",p:{}};render();}return;}
 if(a==="learn"){var l=LET[+t.getAttribute("data-i")][0];S.learned[l]=!S.learned[l];save();render();return;}
 if(a==="next"){Q.i++;Q.res=null;render();window.scrollTo(0,0);return;}
 if(a==="again"){Q=null;V.p={id:t.getAttribute("data-id"),new:1};render();return;}
 if(a==="reset"){if(confirm("Fortschritt wirklich zurücksetzen?")){S={learned:{},best:{},seen:{}};save();render();}return;}
});
document.addEventListener("input",function(e){if(e.target.id==="wbq"){var q=e.target.value,r=document.getElementById("wbr");r.innerHTML=q.replace(/\s/g,"")===""?wbHome():(wbList(q).map(wRow).join("")||'<div class="note">Nichts gefunden.</div>');}});
try{speechSynthesis.getVoices();}catch(e){}
render();
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0)navigator.serviceWorker.register("sw.js").catch(function(){});

</script></body></html>
